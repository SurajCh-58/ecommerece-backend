services:
  web:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    ports:
      - "8848:8000"
    env_file:
      - env/.env.web
    depends_on:
      - db

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - env/.env
    ports:
      - "5432:5432"

volumes:
  postgres_data:
